server:
  port: 8080
spring:
  application:
    name: "crediyaAutenticacion"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediya-autenticacion"
    username: "auth-user"
    password: "auth-password"
    schema: "public"

springdoc:
  swagger-ui:
    path: "/api/doc/swagger-ui.html"
  api-docs:
    path: "/api/doc/api-docs"

scalar:
  url: "http://localhost:8080/api/doc/api-docs"
  path: "/docs"
  enabled: true